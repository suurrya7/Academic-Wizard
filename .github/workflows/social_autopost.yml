name: Autonomous Social Media Poster (Instagram, FB, Twitter)

on:
  schedule:
    # Slot 1: Morning (08:00 UTC = 1:30 PM IST = 9:00 AM London) - Study Hacks & Quick Tips
    - cron: '0 8 * * *'
    # Slot 2: Afternoon (13:00 UTC = 6:30 PM IST = 2:00 PM London) - Deep Academic Guides
    - cron: '0 13 * * *'
    # Slot 3: Evening (17:00 UTC = 10:30 PM IST = 6:00 PM London) - Core Services & Urgent CTAs
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Posting Slot'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - afternoon
          - evening
      force_publish:
        description: 'Publish immediately instead of queuing in Buffer'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry Run (simulate generation without calling Buffer)'
        required: false
        default: false
        type: boolean
      check_buffer:
        description: 'Run Buffer connectivity diagnostic check only'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  post-to-social:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Determine Slot for Scheduled Runs
        id: determine_slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
            echo "force_flag=$([ "${{ github.event.inputs.force_publish }}" = "true" ] && echo "--force-publish" || echo "")" >> $GITHUB_OUTPUT
            echo "dry_flag=$([ "${{ github.event.inputs.dry_run }}" = "true" ] && echo "--dry-run" || echo "")" >> $GITHUB_OUTPUT
            echo "check_flag=$([ "${{ github.event.inputs.check_buffer }}" = "true" ] && echo "--check-buffer" || echo "")" >> $GITHUB_OUTPUT
          else
            UTC_HOUR=$(date -u +%H)
            if [ "$UTC_HOUR" -lt 11 ]; then
              echo "slot=morning" >> $GITHUB_OUTPUT
            elif [ "$UTC_HOUR" -lt 15 ]; then
              echo "slot=afternoon" >> $GITHUB_OUTPUT
            else
              echo "slot=evening" >> $GITHUB_OUTPUT
            fi
            # Free Buffer plan: always force-publish (no queue)
            echo "force_flag=--force-publish" >> $GITHUB_OUTPUT
            echo "dry_flag=" >> $GITHUB_OUTPUT
            echo "check_flag=" >> $GITHUB_OUTPUT
          fi

      - name: Generate Social Media Visuals & Content
        env:
          GEMINI_API_KEY: ${{ secrets.BACKLINK_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          SITE_URL: https://academicwizard.online
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python automation/social_poster.py \
            --slot ${{ steps.determine_slot.outputs.slot }} \
            --generate-only \
            ${{ steps.determine_slot.outputs.dry_flag }} \
            ${{ steps.determine_slot.outputs.check_flag }}

      - name: Commit & Push Social Visual Assets
        run: |
          git config --global user.name 'Academic Wizard Bot'
          git config --global user.email 'bot@academicwizard.online'
          git add public/social/
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(social): update daily social media asset [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Dispatch to Buffer Social Channels
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN || secrets.BUFFER_API_KEY || secrets.BUFFER_API || secrets.BUFFER_TOKEN || secrets.BUFFER_KEY || secrets.BUFFER || secrets.BUFFER_API_TOKEN || secrets.BUFFER_TOKEN_SECRET }}
          SITE_URL: https://academicwizard.online
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python automation/social_poster.py \
            --slot ${{ steps.determine_slot.outputs.slot }} \
            --dispatch-only \
            ${{ steps.determine_slot.outputs.force_flag }} \
            ${{ steps.determine_slot.outputs.dry_flag }} \
            ${{ steps.determine_slot.outputs.check_flag }}
