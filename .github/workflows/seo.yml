name: SEO Meta Tags & Sitemap Update

on:
  push:
    branches:
      - main
  workflow_dispatch:
    # Allow manual triggering from GitHub Actions UI

permissions:
  contents: write

jobs:
  update-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml

      - name: Ensure required directories exist
        run: |
          mkdir -p blog/posts
          mkdir -p data
          mkdir -p public

      - name: Run SEO generation script
        run: python automation/generate_seo.py

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No SEO changes detected."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "SEO changes detected:"
            git diff --cached --stat
          fi

      - name: Commit and push SEO updates
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "🔍 Update SEO meta tags, sitemap & robots.txt — ${DATE}"
          git push
