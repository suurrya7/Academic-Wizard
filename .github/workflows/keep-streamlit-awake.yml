name: Keep Streamlit Humanizer Awake

on:
  schedule:
    # Runs every 12 hours (at minute 0 past every 12th hour)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          echo "Pinging Streamlit App to keep it awake..."
          curl -s -o /dev/null -w "%{http_code}" https://academic-wizard.streamlit.app/
          echo -e "\nPing complete."
