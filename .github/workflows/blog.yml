name: Daily Blog Post Generation

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual triggering from GitHub Actions UI

permissions:
  contents: write

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  generate-blog-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai beautifulsoup4 lxml

      - name: Ensure required directories exist
        run: |
          mkdir -p blog/posts
          mkdir -p data
          mkdir -p public

      - name: Generate blog post
        run: python automation/generate_post.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Update SEO meta tags and sitemap
        run: python automation/generate_seo.py

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --cached --stat
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Build a descriptive commit message
          DATE=$(date -u +"%Y-%m-%d")
          NEW_POSTS=$(git diff --cached --name-only -- 'blog/posts/' | wc -l | tr -d ' ')
          
          if [ "$NEW_POSTS" -gt "0" ]; then
            COMMIT_MSG="📝 Auto-generate blog post(s) & update SEO — ${DATE}

          - Generated ${NEW_POSTS} new/updated blog post(s)
          - Updated sitemap.xml and robots.txt
          - Injected SEO meta tags and JSON-LD schema"
          else
            COMMIT_MSG="🔧 Update SEO assets — ${DATE}

          - Refreshed sitemap.xml and robots.txt
          - Updated SEO meta tags"
          fi
          
          git commit -m "$COMMIT_MSG"
          git push
