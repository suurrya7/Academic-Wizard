name: Autonomous Social Media Poster (Instagram, FB, Twitter)

on:
  schedule:
    # Slot 1: Morning (09:00 UTC = 2:30 PM IST = 10:00 AM London) - Free Tools & Academic Weapon
    - cron: '0 9 * * *'
    # Slot 2: Evening (18:00 UTC = 11:30 PM IST = 7:00 PM London) - Core Services & Night Owl Triage
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Posting Slot'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening
      force_publish:
        description: 'Publish immediately instead of queuing in Buffer'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Dry Run (simulate generation without calling Buffer)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  post-to-social:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/requirements.txt

      - name: Determine Slot for Scheduled Runs
        id: determine_slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
            echo "force_flag=$([ "${{ github.event.inputs.force_publish }}" = "true" ] && echo "--force-publish" || echo "")" >> $GITHUB_OUTPUT
            echo "dry_flag=$([ "${{ github.event.inputs.dry_run }}" = "true" ] && echo "--dry-run" || echo "")" >> $GITHUB_OUTPUT
          else
            UTC_HOUR=$(date -u +%H)
            if [ "$UTC_HOUR" -lt 14 ]; then
              echo "slot=morning" >> $GITHUB_OUTPUT
            else
              echo "slot=evening" >> $GITHUB_OUTPUT
            fi
            echo "force_flag=" >> $GITHUB_OUTPUT
            echo "dry_flag=" >> $GITHUB_OUTPUT
          fi

      - name: Run Autonomous Social Poster
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN || secrets.BUFFER_API_KEY || secrets.BUFFER_API || secrets.BUFFER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.BACKLINK_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-2.5-flash' }}
          SITE_URL: https://academicwizard.online
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python automation/social_poster.py \
            --slot ${{ steps.determine_slot.outputs.slot }} \
            ${{ steps.determine_slot.outputs.force_flag }} \
            ${{ steps.determine_slot.outputs.dry_flag }}

      - name: Commit & Push Social Visual Assets
        run: |
          git config --global user.name 'Academic Wizard Bot'
          git config --global user.email 'bot@academicwizard.online'
          git add public/social/
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore(social): update daily social media asset [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
