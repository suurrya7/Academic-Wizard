name: Keep Streamlit Humanizer Awake

on:
  schedule:
    # Runs every 12 hours (at minute 0 past every 12th hour)
    - cron: '0 */12 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Ping and Wake Streamlit App
        run: |
          node -e "
            const puppeteer = require('puppeteer');
            (async () => {
              console.log('Launching browser to wake Streamlit app...');
              const browser = await puppeteer.launch({ args: ['--no-sandbox'] });
              const page = await browser.newPage();
              // Streamlit apps can take up to 2-3 minutes to boot if sleeping
              page.setDefaultNavigationTimeout(300000); 
              await page.goto('https://academic-wizard.streamlit.app/', { waitUntil: 'networkidle2' });
              console.log('App successfully reached. Waiting 15 seconds to ensure websocket connection...');
              await new Promise(r => setTimeout(r, 15000));
              const html = await page.content();
              if (html.includes('Please wait...')) {
                 console.log('App is still booting, but the request was registered.');
              } else {
                 console.log('App is fully awake and rendered.');
              }
              await browser.close();
            })();
          "
